<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Nance</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #ffffff;
        color: #0a0a0a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        .card { border-color: #262626 !important; }
        .muted { color: #a3a3a3 !important; }
      }
      .card {
        max-width: 24rem;
        width: 100%;
        text-align: center;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 32px 24px;
      }
      .dot {
        width: 48px; height: 48px; border-radius: 9999px;
        margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
        background: rgba(245, 158, 11, 0.15); font-size: 22px;
      }
      h1 { font-size: 1.125rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 0.925rem; }
      .muted { color: #525252; }
      button {
        font: inherit; cursor: pointer; border: 0; border-radius: 10px;
        padding: 10px 18px; background: #0a0a0a; color: #fff; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) { button { background: #fafafa; color: #0a0a0a; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">⚡</div>
      <h1>You're offline</h1>
      <p class="muted">
        Nance needs a connection to show your latest clients, projects and
        finances. Check your network and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
